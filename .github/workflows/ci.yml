name: CI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 型チェック（tsc --noEmit）
        run: npm run typecheck

      - name: ビルド情報を取得
        id: buildinfo
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: 本番ビルド確認
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ steps.buildinfo.outputs.sha }}
          VITE_BUILD_TIME: ${{ steps.buildinfo.outputs.time }}
